# API Contracts: Advanced Cloud Deployment

## OpenAPI Specification for Todo Chatbot with Advanced Features

```yaml
openapi: 3.0.3
info:
  title: Advanced Todo Chatbot API
  description: API for advanced todo chatbot with recurring tasks, due dates, and reminders
  version: 1.0.0
  contact:
    name: Todo Chatbot Team

servers:
  - url: https://api.todo-chatbot.com/v1
    description: Production server
  - url: https://staging.todo-chatbot.com/v1
    description: Staging server
  - url: http://localhost:8000/v1
    description: Development server

paths:
  /tasks:
    get:
      summary: Get all tasks for the user
      description: Retrieve a list of tasks with optional filtering and sorting
      parameters:
        - name: status
          in: query
          description: Filter tasks by status
          schema:
            type: string
            enum: [pending, completed, archived]
        - name: priority
          in: query
          description: Filter tasks by priority
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - name: tag
          in: query
          description: Filter tasks by tag
          schema:
            type: string
        - name: due_date_from
          in: query
          description: Filter tasks with due date from this date
          schema:
            type: string
            format: date
        - name: due_date_to
          in: query
          description: Filter tasks with due date to this date
          schema:
            type: string
            format: date
        - name: sort
          in: query
          description: Sort tasks by field and direction
          schema:
            type: string
            example: "due_date:asc"
        - name: limit
          in: query
          description: Limit number of results
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  total:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create a new task
      description: Create a new task with specified attributes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  description: Task title
                  maxLength: 200
                description:
                  type: string
                  description: Detailed task description
                  maxLength: 2000
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                  default: medium
                tags:
                  type: array
                  items:
                    type: string
                due_date:
                  type: string
                  format: date-time
                recurrence_pattern:
                  $ref: '#/components/schemas/RecurrencePattern'
                reminder_settings:
                  $ref: '#/components/schemas/ReminderSettings'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tasks/{taskId}:
    get:
      summary: Get a specific task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
                status:
                  type: string
                  enum: [pending, completed, archived]
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                tags:
                  type: array
                  items:
                    type: string
                due_date:
                  type: string
                  format: date-time
                recurrence_pattern:
                  $ref: '#/components/schemas/RecurrencePattern'
                reminder_settings:
                  $ref: '#/components/schemas/ReminderSettings'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{taskId}/complete:
    post:
      summary: Mark task as completed
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task completion status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/search:
    get:
      summary: Search tasks
      description: Search tasks by text content
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Limit number of results
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chat/conversation:
    post:
      summary: Send message to chatbot
      description: Send a message to the task management chatbot and receive a response with updated tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: User's message to the chatbot
                user_context:
                  type: object
                  description: Additional context about the user or session
      responses:
        '200':
          description: Chatbot response with task operations
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: Chatbot's response message
                  tasks_affected:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                          enum: [create, update, delete, complete]
                        task_id:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/preferences:
    get:
      summary: Get user preferences
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      summary: Update user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier
        title:
          type: string
          description: Task title
          maxLength: 200
        description:
          type: string
          description: Detailed task description
          maxLength: 2000
        status:
          type: string
          enum: [pending, completed, archived]
          description: Current status of the task
        priority:
          type: string
          enum: [low, medium, high, urgent]
          description: Priority level
        tags:
          type: array
          description: Categories for the task
          items:
            type: string
        due_date:
          type: string
          format: date-time
          description: When the task is due
        recurrence_pattern:
          $ref: '#/components/schemas/RecurrencePattern'
        created_at:
          type: string
          format: date-time
          description: When the task was created
        updated_at:
          type: string
          format: date-time
          description: When the task was last updated
        completed_at:
          type: string
          format: date-time
          description: When the task was completed (if applicable)
        user_id:
          type: string
          description: ID of the user who owns the task

    RecurrencePattern:
      type: object
      properties:
        type:
          type: string
          enum: [daily, weekly, monthly, yearly, custom]
          description: How often the task recurs
        interval:
          type: integer
          description: Number of intervals between recurrences (e.g., every 2 weeks)
          minimum: 1
        days_of_week:
          type: array
          items:
            type: string
            enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
          description: Days of week for weekly recurrence
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
          description: Day of month for monthly recurrence
        end_date:
          type: string
          format: date
          description: Date when recurrence should stop
        occurrence_count:
          type: integer
          minimum: 1
          description: Number of times the task should recur

    ReminderSettings:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
          description: Whether reminders are enabled for this task
        time_before:
          type: integer
          description: Minutes before due time to send reminder
          minimum: 1
        notification_channels:
          type: array
          items:
            type: string
            enum: [email, push, sms]
          description: Channels to send reminders through

    UserPreferences:
      type: object
      properties:
        notification_channels:
          type: array
          items:
            type: string
            enum: [email, push, sms]
          description: Preferred notification channels
        default_reminder_time:
          type: integer
          description: Default minutes before due time for reminders
          minimum: 1
        default_priority:
          type: string
          enum: [low, medium, high, urgent]
          description: Default priority for new tasks
        recurring_task_defaults:
          $ref: '#/components/schemas/RecurrencePattern'

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []

tags:
  - name: tasks
    description: Task management operations
  - name: chat
    description: Chatbot interaction
  - name: users
    description: User preferences and settings
```