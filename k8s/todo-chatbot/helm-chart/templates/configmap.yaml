apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
data:
  NEXT_PUBLIC_API_URL: "http://{{ include "todo-chatbot.fullname" . }}-backend.{{ .Release.Namespace }}.svc.cluster.local:8000"
  FRONTEND_URL: {{ .Values.frontend.ingress.host | quote }}